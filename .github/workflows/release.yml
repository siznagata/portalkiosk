name: release

# タグ（v1.1 など）を push すると、署名済みのAPKをビルドして GitHub Releases に公開する。
# 端末のアプリは、この Releases の最新版を確認して自動で更新する。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 署名鍵を復元する
        env:
          KEYSTORE_BASE64: ${{ secrets.KIOSK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kiosk.jks"
          echo "KIOSK_KEYSTORE_FILE=$RUNNER_TEMP/kiosk.jks" >> "$GITHUB_ENV"

      - name: ビルドする
        env:
          KIOSK_KEYSTORE_PASSWORD: ${{ secrets.KIOSK_KEYSTORE_PASSWORD }}
          KIOSK_KEY_ALIAS: ${{ secrets.KIOSK_KEY_ALIAS }}
          KIOSK_KEY_PASSWORD: ${{ secrets.KIOSK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PupdateRepo="${{ github.repository }}" \
            -PkioskVersionCode="${{ github.run_number }}" \
            -PkioskVersionName="${{ github.ref_name }}"

      - name: APKとハッシュを用意する
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/portalkiosk-${{ github.run_number }}.apk"
          cd dist
          sha256sum "portalkiosk-${{ github.run_number }}.apk" > "portalkiosk-${{ github.run_number }}.apk.sha256"

      - name: リリースを公開する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --notes "社員ポータル 共有端末アプリ ${{ github.ref_name }}"
